# Netlify config for BrandGuard AI (monorepo: the web app lives in /frontend)

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"          # relative to `base`

[build.environment]
  NODE_VERSION = "20"
  # VITE_* values are public by design and get bundled into the browser JS.
  # Without this, Netlify's secrets scanner can fail the deploy when it finds
  # them in the build output.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"

# Single-page app: send every route to index.html so deep links and refreshes
# (e.g. /dashboard, /login) don't 404. Real files (assets, favicon) still win.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
